# Configuracion del servidor web del proyecto SIGA
ServerName siga-apache

# Ocultar la version del servidor en las respuestas (politica de seguridad)
ServerTokens Prod
ServerSignature Off

# Redirigir las peticiones /api hacia el contenedor de la aplicacion.
# "api" es el nombre del servicio en docker-compose y Docker lo resuelve
# como nombre de host dentro de la red interna.
ProxyPreserveHost On
ProxyPass        "/api"  "http://api:3000/api"
ProxyPassReverse "/api"  "http://api:3000/api"

# Impedir el listado de directorios
<Directory "/usr/local/apache2/htdocs">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
