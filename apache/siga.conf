# Configuracion del servidor web del proyecto SIGA
ServerName siga-apache

# Ocultar la version del servidor en las respuestas (politica de seguridad)
ServerTokens Prod
ServerSignature Off

# Apache recibe todas las peticiones y las entrega a la interfaz web.
# "frontend" es el nombre del servicio en docker-compose; Docker lo resuelve
# como nombre de host dentro de la red interna. La interfaz web, a su vez,
# reenvia las llamadas /api a la API agregando el token de la sesion.
ProxyPreserveHost On
ProxyPass        "/"  "http://frontend:4000/"
ProxyPassReverse "/"  "http://frontend:4000/"

# Impedir el listado de directorios
<Directory "/usr/local/apache2/htdocs">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
